name: Automatic coffee sponsor activation

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/automatic-coffee-sponsor.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coffee-sponsor-mail
  cancel-in-progress: false

jobs:
  process-sponsor-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile .github/scripts/process_sponsor_mail.py .github/scripts/test_process_sponsor_mail.py

      - name: Run parser tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Process Yahoo sponsor requests
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          SPONSOR_TEST_BYPASS_WINDOW: "1" # Temporarily bypass 06:00-15:00 for this test
          SPONSOR_DIAGNOSTIC: "1"
        run: python .github/scripts/process_sponsor_mail.py
